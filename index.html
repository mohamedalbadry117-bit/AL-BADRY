<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البدري للدراسة في الخارج</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --text: #334155;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
        .container { max-width: 600px; background: white; margin: 30px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        header { text-align: center; margin-bottom: 30px; }
        header img { height: 85px; width: auto; object-fit: contain; margin-bottom: 15px; }
        h1 { color: var(--primary); font-size: 24px; margin-bottom: 8px; }
        p { color: #64748b; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--primary); font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: border 0.2s; }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        button { width: 100%; padding: 14px; background-color: #25d366; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        button:hover { background-color: #20ba56; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="logo.png" alt="لوجو البدري">
        <h1>البدري للدراسة في الخارج</h1>
        <p>سجل بياناتك الآن وسنقوم بالتواصل معك لتأمين قبولك الجامعي في مصر</p>
    </header>

    <form id="regForm" onsubmit="event.preventDefault(); sendToWhatsApp();">
        <div class="form-group">
            <label for="name">الاسم الكامل للطالب</label>
            <input type="text" id="name" placeholder="اكتب اسمك الثلاثي أو الرباعي" required>
        </div>

        <div class="form-group">
            <label for="phone">رقم الهاتف (واتساب)</label>
            <input type="tel" id="phone" placeholder="مثال: 249900000000 أو 201000000000" required>
        </div>

        <div class="form-group">
            <label for="cert">نوع الشهادة الثانوية</label>
            <select id="cert" required>
                <option value="" disabled selected>اختر نوع الشهادة</option>
                <option value="شهادة سودانية">شهادة سودانية</option>
                <option value="شهادة مصرية">شهادة مصرية</option>
                <option value="شهادة عربية / خليجية">شهادة عربية / خليجية</option>
            </select>
        </div>

        <div class="form-group">
            <label for="percentage">النسبة المئوية (%)</label>
            <input type="number" step="0.01" id="percentage" placeholder="مثال: 85.5" required>
        </div>

        <div class="form-group">
            <label for="branch">التخصص المرغوب دراسته</label>
            <input type="text" id="branch" placeholder="مثال: هندسة حاسوب، طب بشري، إدارة أعمال" required>
        </div>

        <button type="submit">
            إرسال الطلب عبر الواتساب دقيقة
        </button>
    </form>
</div>

<script>
function sendToWhatsApp() {
    const name = document.getElementById('name').value.trim();
    let studentPhone = document.getElementById('phone').value.trim();
    const cert = document.getElementById('cert').value;
    const percentage = document.getElementById('percentage').value.trim();
    const branch = document.getElementById('branch').value.trim();

    // تنظيف رقم الطالب لو كتب + أو 00 في البداية
    if (studentPhone.startsWith('+')) {
        studentPhone = studentPhone.substring(1);
    } else if (studentPhone.startsWith('00')) {
        studentPhone = studentPhone.substring(2);
    }

    // تنسيق نص الرسالة الحيجيك في شاتك
    const text = `طلب تقديم جديد - مكتب البدري:\n\n` +
                 `📝 الاسم: ${name}\n` +
                 `📞 الهاتف: ${studentPhone}\n` +
                 `🎓 الشهادة: ${cert}\n` +
                 `📊 النسبة: ${percentage}%\n` +
                 `✨ التخصص المرغوب: ${branch}\n\n` +
                 `الدولة المطلوبة: جمهورية مصر العربية 🇪🇬`;

    // غيّر الرقم التحت دا (2499XXXXXXXX) لرقمك الحقيقي بدون أصفار ولا زائد
    const myPhone = "2499XXXXXXXX"; 
    
    const whatsappUrl = `https://wa.me/${myPhone}?text=${encodeURIComponent(text)}`;
    window.open(whatsappUrl, '_blank');
}
</script>

</body>
</html>
